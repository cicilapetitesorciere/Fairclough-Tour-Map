<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lee Fairclough Tour Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/map.css">

<main class="page">
  <div class="map-box" id="map-box">
    <div class="search">
      <input type="search" id="search-input" placeholder="Find your riding…" autocomplete="off" spellcheck="false"
             role="combobox" aria-label="Find your riding" aria-expanded="false" aria-controls="search-list" aria-autocomplete="list">
      <ul id="search-list" role="listbox" hidden></ul>
    </div>
    <p class="notice" id="notice" role="status" hidden></p>
    <svg id="map" aria-label="Map of Ontario's provincial ridings"></svg>
    <button type="button" class="back-btn" id="view-back" hidden>← Back to full map</button>
    <div class="view-label" id="view-label" aria-live="polite" hidden></div>
    <div class="tip" id="tip" hidden>
      <span class="tip-name" id="tip-name"></span>
      <span class="tip-detail" id="tip-detail"></span>
    </div>
  </div>
</main>

<dialog class="info" id="info" aria-labelledby="info-name">
  <button type="button" class="info-close" id="info-close" aria-label="Close">×</button>
  <h2 class="info-name" id="info-name"></h2>
  <p class="info-text" id="info-text"></p>
  <div class="info-photos" id="info-photos"></div>
</dialog>

<!-- Plain scripts that share globals, so the order matters. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/map-view.js"></script>
<script src="js/map-layers.js"></script>
<script src="js/map-tooltip.js"></script>
<script src="js/map-info.js"></script>
<script src="js/map-search.js"></script>
<script src="js/map-draw.js"></script>
<script src="js/main.js"></script>
